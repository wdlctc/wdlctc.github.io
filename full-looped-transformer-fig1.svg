<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 470" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- ===================== Panel titles ===================== -->
  <text x="170" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">(a) Plain looped transformer</text>
  <text x="662" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">(b) Full looped transformer (ours)</text>

  <!-- ===================== Panel (a) ===================== -->
  <text x="170" y="449" text-anchor="middle" font-size="12" fill="#333">input tokens</text>
  <line x1="170" y1="437" x2="170" y2="433" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="95" y="405" width="150" height="26" fill="#f7f9fa" stroke="#8e44ad" stroke-width="1.5" rx="4"/>
  <text x="170" y="422" text-anchor="middle" font-size="12" fill="#333">Embedding E</text>
  <line x1="170" y1="405" x2="170" y2="388" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="95" y="360" width="150" height="26" fill="#f7f9fa" stroke="#34495e" stroke-width="1.5" rx="4"/>
  <text x="170" y="377" text-anchor="middle" font-size="12" fill="#333">Prelude (2 layers)</text>
  <line x1="170" y1="360" x2="170" y2="327" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="95" y="275" width="150" height="50" fill="#f7f9fa" stroke="#34495e" stroke-width="1.5" rx="4"/>
  <text x="170" y="296" text-anchor="middle" font-size="12" fill="#333">Shared middle</text>
  <text x="170" y="312" text-anchor="middle" font-size="12" fill="#333">(4 layers)</text>
  <path d="M 245 285 L 285 285 L 285 308 L 251 308" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="294" y="292" font-size="12" fill="#555">&#215;3</text>
  <text x="294" y="307" font-size="10" fill="#888">state only</text>
  <line x1="170" y1="275" x2="170" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="95" y="190" width="150" height="26" fill="#f7f9fa" stroke="#34495e" stroke-width="1.5" rx="4"/>
  <text x="170" y="207" text-anchor="middle" font-size="12" fill="#333">Coda (2 layers)</text>
  <line x1="170" y1="190" x2="170" y2="172" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="95" y="130" width="150" height="40" fill="#f7f9fa" stroke="#8e44ad" stroke-width="1.5" rx="4"/>
  <text x="170" y="146" text-anchor="middle" font-size="11" fill="#333">RMSNorm, tied head E</text>
  <text x="170" y="162" text-anchor="middle" font-size="11" fill="#333">softcap, softmax</text>
  <line x1="170" y1="130" x2="170" y2="114" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="170" y="104" text-anchor="middle" font-size="12" fill="#333">next-token distribution p</text>

  <!-- ===================== Panel (b) ===================== -->
  <text x="560" y="449" text-anchor="middle" font-size="12" fill="#333">input tokens</text>
  <line x1="560" y1="437" x2="560" y2="433" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="485" y="405" width="150" height="26" fill="#f7f9fa" stroke="#8e44ad" stroke-width="1.5" rx="4"/>
  <text x="560" y="422" text-anchor="middle" font-size="12" fill="#333">Embedding E</text>
  <line x1="560" y1="405" x2="560" y2="388" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="485" y="360" width="150" height="26" fill="#f7f9fa" stroke="#34495e" stroke-width="1.5" rx="4"/>
  <text x="560" y="377" text-anchor="middle" font-size="12" fill="#333">Prelude (2 layers)</text>
  <line x1="560" y1="360" x2="560" y2="327" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="485" y="275" width="150" height="50" fill="#f7f9fa" stroke="#34495e" stroke-width="1.5" rx="4"/>
  <text x="560" y="296" text-anchor="middle" font-size="12" fill="#333">Shared middle</text>
  <text x="560" y="312" text-anchor="middle" font-size="12" fill="#333">(4 layers)</text>
  <line x1="560" y1="275" x2="560" y2="258" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="560" cy="247" r="9" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <line x1="555" y1="247" x2="565" y2="247" stroke="#27ae60" stroke-width="2"/>
  <line x1="560" y1="242" x2="560" y2="252" stroke="#27ae60" stroke-width="2"/>
  <line x1="560" y1="238" x2="560" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 551 247 L 470 247 L 470 300 L 479 300" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="446" y="278" font-size="12" fill="#555">&#215;3</text>
  <!-- feedback tap: middle right edge -> feedback box (bottom), below the annotation-free lane -->
  <path d="M 635 315 L 747 315 L 747 287" fill="none" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrg)"/>
  <!-- feedback box -->
  <rect x="655" y="215" width="185" height="66" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8" rx="6"/>
  <text x="747" y="233" text-anchor="middle" font-size="11" fill="#1e6641">decode with tied head: p</text>
  <text x="747" y="250" text-anchor="middle" font-size="11" fill="#1e6641">soft re-embed: r = pE</text>
  <text x="747" y="267" text-anchor="middle" font-size="11" fill="#1e6641">project: W_o (zero-init)</text>
  <!-- feedback box out -> (+) -->
  <line x1="655" y1="247" x2="573" y2="247" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrg)"/>
  <!-- tie annotation, clear of the tap line -->
  <text x="747" y="337" text-anchor="middle" font-size="9.5" fill="#888">decode = the model's own exit pipeline (tied E);</text>
  <text x="747" y="349" text-anchor="middle" font-size="9.5" fill="#888">applied at every junction, incl. before the coda</text>
  <rect x="485" y="190" width="150" height="26" fill="#f7f9fa" stroke="#34495e" stroke-width="1.5" rx="4"/>
  <text x="560" y="207" text-anchor="middle" font-size="12" fill="#333">Coda (2 layers)</text>
  <line x1="560" y1="190" x2="560" y2="172" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="485" y="130" width="150" height="40" fill="#f7f9fa" stroke="#8e44ad" stroke-width="1.5" rx="4"/>
  <text x="560" y="146" text-anchor="middle" font-size="11" fill="#333">RMSNorm, tied head E</text>
  <text x="560" y="162" text-anchor="middle" font-size="11" fill="#333">softcap, softmax</text>
  <line x1="560" y1="130" x2="560" y2="114" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="560" y="104" text-anchor="middle" font-size="12" fill="#333">next-token distribution p</text>
</svg>
